<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>cafe aroma</title>
</head>
<body>
    <header class="header">
        <div class="header-logo">
            <img src="images/xicara-de-cafe.png" alt="icone xicara de cafe">
            <h1>Café Aroma</h1>
        </div>
        <nav class="menu">
            <a href="#">Início</a>
            <a href="#">Sobre</a>
            <a href="#">Cardápio</a>
        </nav>
    </header>
    <main>
        <div class="container">
            <section class="hero">
                <div class="hero-content">
                    <div class="hero-left">
                        <h1>O melhor café da cidade</h1>
                        <p>Sabores únicos preparados<br>com grãos selecionados.</p>
                        <a href="#">Ver Cardápio</a>
                    </div>
                    <div class="hero-right"><img src="images/imagem xicara de cafe-sem fundo.png" alt="imagem xicara de cafe"></div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
